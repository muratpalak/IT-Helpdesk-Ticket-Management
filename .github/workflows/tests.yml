name: Helpdesk API Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    name: API tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API and test dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Run integration tests
        run: python -m pytest -q tests
      - name: Check frontend JavaScript syntax
        run: node --check static/app.js
